version: '3.8'
services:
  namesrv:
    image: apache/rocketmq:5.3.2
    container_name: rmqnamesrv
    ports:
      - 9876:9876
    networks:
      - rocketmq
    command: sh mqnamesrv
  # broker 使用 brokerIP1=127.0.0.1 向 NameServer 注册，宿主机应用才能连上
  broker:
    image: apache/rocketmq:5.3.2
    container_name: rmqbroker
    ports:
      - 10909:10909
      - 10911:10911
      - 10912:10912
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    depends_on:
      - namesrv
    networks:
      - rocketmq
    command: ["sh", "-c", "echo 'brokerIP1=127.0.0.1' > /tmp/broker.conf && sh mqbroker -c /tmp/broker.conf"]
  # Proxy 供 gRPC 用，当前 Java 客户端直连 Broker 不需要；单机下易报 create system broadcast topic 失败，已关闭
  # proxy:
  #   image: apache/rocketmq:5.3.2
  #   container_name: rmqproxy
  #   networks: [rocketmq]
  #   depends_on: [broker, namesrv]
  #   ports: ["8082:8080", "8083:8081"]
  #   environment: [NAMESRV_ADDR=rmqnamesrv:9876]
  #   command: sh mqproxy
networks:
  rocketmq:
    driver: bridge