spring:
  data:
    redis:
      host: localhost
      port: 6379
      # password: 如有密码则填写
      database: 0
      timeout: 5000ms
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: 你的数据库连接url（如 jdbc:mysql://主机:端口/库名?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8）
    username: 你的数据库用户名
    password: 你的数据库密码
  servlet:
    multipart:
      enabled: true
      max-file-size: 1GB        # 单个文件最大 1GB
      max-request-size: 1GB     # 整个请求最大 1GB

# MyBatis-Plus基本配置
mybatis-plus:
  type-aliases-package: com.dragons.core.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# JWT配置
jwt:
  secret: 你的JWT密钥（生产环境请使用足够长且随机的字符串）
  expiration: 604800000  # 过期时间（毫秒），如 7 天

# MinIO 配置（若使用 MinIO 存储）
minio:
  endpoint: 你的MinIO服务地址（如 http://localhost:9000）
  access-key: 你的MinIO访问键
  secret-key: 你的MinIO私钥
  bucket: 你的存储桶名称

# 阿里云 OSS 配置（若使用阿里云 OSS 存储，需在 RAM 控制台创建 AccessKey）
oss:
  endpoint: OSS 地域节点（如 oss-cn-beijing.aliyuncs.com，不要加 https:// 前缀）
  access-key-id: 你的阿里云 RAM AccessKeyId
  access-key-secret: 你的阿里云 RAM AccessKeySecret
  bucket: 你的 OSS Bucket 名称（如 dragons-media）
  # STS 临时凭证（可选，供前端 OSS SDK 分片上传等）
  # 配置后 GET /api/media/upload/sts 返回临时凭证；需在 RAM 控制台创建角色并授予 oss:PutObject，且当前 AK 有 sts:AssumeRole 权限
  sts:
    region: cn-beijing
    role-arn: acs:ram::你的账号ID:role/你的角色名
    role-session-name: dragons-frontend-upload
    duration-seconds: 3600

# DB 写入重试配置（AOP）
db-retry:
  max-attempts: 3
  initial-delay-ms: 100
  max-delay-ms: 1000
  multiplier: 2.0
  jitter-ratio: 0.2
