services:
  backend:
    platform: linux/amd64
    build:
      context: ./dragons-core-server
      dockerfile: Dockerfile
    image: dragons-zone-backend:${IMAGE_TAG:-latest}
    container_name: dragons-core-backend
    ports:
      # 仅绑定本地，由宿主机 nginx 反向代理，外部不直接访问 8080
      - "127.0.0.1:8080:8080"
    # 可选：通过环境变量覆盖 application.yml 中的配置（例如把 localhost 改为宿主机/云上地址）
    environment:
        SPRING_DATASOURCE_URL: ${DB_URL}
        SPRING_DATASOURCE_USERNAME: ${DB_USER}
        SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
        SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
        SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
        SPRING_DATA_REDIS_USERNAME: ${REDIS_USER}
        SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASS}
    restart: always
    networks:
      - dragons-net

  frontend:
    platform: linux/amd64
    build:
      context: ./dragons-frontend
      dockerfile: Dockerfile
      args:
        # 从根目录 .env 传入，供 Vite 构建时注入
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: dragons-zone-frontend:${IMAGE_TAG:-latest}
    container_name: dragons-frontend-web
    depends_on:
      - backend
    ports:
      # 仅绑定本地 8081，宿主机 80 留给 nginx；nginx 反向代理到 127.0.0.1:8081（前端）和 127.0.0.1:8080（后端）
      - "127.0.0.1:8081:80"
    restart: always
    networks:
      - dragons-net

networks:
  dragons-net:
    driver: bridge

