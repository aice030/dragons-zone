# Dragons Zone - 前后端 + 可选 MySQL
# 在 macOS 上构建 Linux 镜像: docker compose build
# 部署到阿里云 Linux: docker compose up -d
#
# 使用自建 MySQL（同机）: docker compose --profile with-db up -d
# 使用阿里云 RDS: 在 .env 中配置 SPRING_DATASOURCE_* 指向 RDS，然后 docker compose up -d（不启动 mysql）

services:
  backend:
    build:
      context: ./dragons-core-server
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: dragons-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/dragons?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-dragons-zone-secret-key-change-in-production}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-604800000}
      - OSS_ENDPOINT=${OSS_ENDPOINT}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - OSS_BUCKET=${OSS_BUCKET:-dragons-media}
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./dragons-frontend
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: dragons-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  mysql:
    profiles:
      - with-db
    image: mysql:8.0
    platform: linux/amd64
    container_name: dragons-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dragons}
      MYSQL_USER: ${MYSQL_USER:-dragons}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dragons}
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
